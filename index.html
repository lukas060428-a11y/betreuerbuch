<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Betreuerbuch</title>
  <meta name="theme-color" content="#0f6b5c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Betreuerbuch">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="manifest" href="manifest.webmanifest?v=2">
  <link rel="icon" href="icon.svg?v=2" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png?v=2">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="locked">
  <header class="topbar">
    <button id="back" class="icon-btn" hidden aria-label="Zurück"><svg class="ic" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h1 id="title"></h1>
    <div id="actions"></div>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Hauptnavigation">
    <button data-tab="heute"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7M6 9.5V20h12V9.5"/></svg><span>Heute</span></button>
    <button data-tab="klienten"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5M16 4.8a3.5 3.5 0 0 1 0 6.4M18 14.8c2 .7 3.2 2.4 3.5 5.2"/></svg><span>Klienten</span></button>
    <button data-tab="fahrten"><svg viewBox="0 0 24 24"><path d="M5 16V11l2-5h10l2 5v5M5 16h14M5 16v3h3v-3M16 16v3h3v-3M5 11h14"/></svg><span>Fahrten</span></button>
    <button data-tab="fristen"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span>Fristen</span><i id="tab-badge" hidden></i></button>
    <button data-tab="mehr"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg><span>Mehr</span></button>
  </nav>

  <div id="lock" hidden></div>
  <dialog id="dlg"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="print"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
